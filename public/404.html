<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <meta name="theme-color" content="#ffffff" />
  <title>404 · Page Not Found / 页面未找到 · PentaPrompt</title>
  <link rel="icon" type="image/png" href="/logo.png" />
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 24px;
      padding: 24px;
      background: #F0F0F0;
      color: #0f172a;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
    }
    a { color: inherit; }
    .brand { font-weight: 900; letter-spacing: -0.04em; text-transform: uppercase; font-size: 22px; text-decoration: none; align-self: center; }
    .card {
      max-width: 560px;
      width: 100%;
      background: #fff;
      border: 3px solid #000;
      box-shadow: 8px 8px 0 0 #000;
      padding: 32px;
      text-align: center;
    }
    .code { font-size: 96px; line-height: 1; font-weight: 900; letter-spacing: -0.06em; margin: 0; }
    h1 { font-size: 24px; margin: 12px 0 8px; text-transform: uppercase; letter-spacing: -0.02em; }
    p { margin: 6px 0; color: #475569; line-height: 1.6; }
    .actions { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; margin-top: 24px; }
    .btn {
      display: inline-block;
      padding: 12px 20px;
      border: 2.5px solid #000;
      background: #fff;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: .08em;
      font-size: 12px;
      text-decoration: none;
      box-shadow: 4px 4px 0 0 #000;
    }
    .btn:hover { transform: translate(2px, 2px); box-shadow: 2px 2px 0 0 #000; }
    .btn.primary { background: #FACC15; }
    .btn.zh { background: #2DD4BF; }
    .footer { font-size: 11px; letter-spacing: .18em; text-transform: uppercase; color: #64748b; }
  </style>
</head>

<body>
  <a class="brand" href="/">PentaPrompt</a>

  <div class="card">
    <p class="code">404</p>
    <h1>Page not found / 页面未找到</h1>
    <p>This URL does not exist — it may have been moved, renamed, or deleted.</p>
    <p>这个链接不存在：可能已移动、改名或删除。</p>
    <div class="actions">
      <a class="btn primary" href="/">Prompt Library</a>
      <a class="btn zh" href="/zh">中文首页</a>
      <a class="btn" href="/guides">Guides 指南</a>
    </div>
  </div>

  <p class="footer">PentaPrompt · 404</p>
</body>

</html>
